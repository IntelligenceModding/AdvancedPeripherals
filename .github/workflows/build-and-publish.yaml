name: Build and Publish

on:
  workflow_dispatch:
  push:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  generate-artifact-name:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - name: Generate Name
        id: name
        run: |
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            suffix="PR ${{ github.event.number }}"
          else
            ref="${{ github.ref }}"
            ref="${ref#refs/heads/}"
            suffix="${ref//\//-}"
          fi
          name="AdvancedPeripherals $suffix"
          echo "name: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs:
      - generate-artifact-name
    uses: IntelligenceModding/actions/.github/workflows/build-and-test.yaml@master
    with:
      build_name: ${{ needs.generate-artifact-name.outputs.name }}
      pr: ${{ github.event_name == 'pull_request' && github.event.number || '' }}
      pr_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
      pr_repo: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || '' }}
      check: ${{ github.event_name != 'push' }}
      java-version: ''

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.ref, 'release/')) }}
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          cache: 'gradle'
          java-version-file: '.tool-versions'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Download Builds
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-and-test.outputs.artifact-name }}
          path: build/libs
      - name: Patch Changelog
        run: ./gradlew patchChangelog
      - name: Push Changelog Patch
        run: |
          ref="${{ github.ref }}"
          ref="${ref#refs/heads/}"
          dev_ref="dev/${ref#release/}"
          remote=$(git config branch.$(git name-rev --name-only HEAD).remote)
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m 'action: patchChangelog' || exit 0
          git push
          git push "$remote" "${ref}:${dev_ref}"
      - name: Github Release
        env:
          GITHUB_KEY: ${{ github.token }}
        run: ./gradlew githubRelease
      - name: Publish Modrinth
        env:
          MODRINTH_KEY: ${{ secrets.MODRINTH_KEY }}
        run: ./gradlew modrinth
      - name: Publish CurseForge
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
        run: ./gradlew publishCurseForgePublicationToCurseForge
      - name: Publish Maven
        env:
          PUBLIC_REP_NAME: ${{ secrets.PUBLIC_REP_NAME }}
          PUBLIC_REP_KEY: ${{ secrets.PUBLIC_REP_KEY }}
        run: ./gradlew publishAllPublicationsToPublicRepository
