configurations {
    implementationExtra
    testModImplementation.extendsFrom(implementation)
    testModImplementation.extendsFrom(testImplementation)
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // If some of the dependencies are not needed in the dev environment, you can comment the `runtimeOnly` line so it
    // will not be included in the client.

    errorprone "com.google.errorprone:error_prone_core:2.42.0"

    // Minimal requirements
    compileOnly "org.jetbrains:annotations:${jb_annotations}"
    modImplementation "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}"

    // Minimal requirements end

    modCompileOnly "curse.maven:refined-storage-243076:${refinedstorage_version}"
    if (!minimumRuntime) {
        modRuntimeOnly "curse.maven:refined-storage-243076:${refinedstorage_version}"
    }

    // Extended requirements
    // We don't use the api since we need a specific class from mekanism
    modCompileOnly "mekanism:Mekanism:${mekanism_version}"
    if (!minimumRuntime) {
        modRuntimeOnly "mekanism:Mekanism:${mekanism_version}"
    }

    // Applied Energistics 2
    modCompileOnly "appeng:appliedenergistics2-forge:${appliedenergistics_version}"
    if (!minimumRuntime) {
        modRuntimeOnly "appeng:appliedenergistics2-forge:${appliedenergistics_version}"
    }

    // Applied Mekanistics
    modCompileOnly "curse.maven:applied-mekanistics-574300:${appliedmekanistics_version}"
    if (!minimumRuntime) {
        modRuntimeOnly "curse.maven:applied-mekanistics-574300:${appliedmekanistics_version}"
    }

    // AE2 Things
    modCompileOnly "curse.maven:ae2things-609977:${ae2things_version}-sources"
    if (!minimumRuntime) {
        modRuntimeOnly "curse.maven:ae2things-609977:${ae2things_version}-sources"
    }

    // Create
    modCompileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    modCompileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"
    modCompileOnly "net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"
    if (!minimumRuntime) {
        modRuntimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
        modRuntimeOnly "com.tterrag.registrate:Registrate:${registrate_version}"
        modRuntimeOnly "dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"
        modRuntimeOnly "net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"
    }

    // Curios
    modCompileOnly "top.theillusivec4.curios:curios-forge:${curios_version}:api"
    if (!minimumRuntime) {
        modRuntimeOnly "top.theillusivec4.curios:curios-forge:${curios_version}"
    }

    // DimStorage
    modCompileOnly "curse.maven:dimstorage-353882:${dimstorage_version}"
    modCompileOnly "curse.maven:edivadlib-638508:${edivadlib_version}"

    // Minecolonies
    modCompileOnly "com.ldtteam:blockui:${blockui_version}"
    modCompileOnly "curse.maven:domum-ornamentum-527361:${domumornamentum_version}"
    modCompileOnly "com.ldtteam:minecolonies:${minecolonies_version}"
    modCompileOnly "com.ldtteam:structurize:${structurize_version}"
    if (!minimumRuntime) {
        modRuntimeOnly "com.ldtteam:blockui:${blockui_version}"
        modRuntimeOnly "curse.maven:domum-ornamentum-527361:${domumornamentum_version}"
        modRuntimeOnly "com.ldtteam:minecolonies:${minecolonies_version}"
        modRuntimeOnly "com.ldtteam:structurize:${structurize_version}"
    }

    // Patchouli
    modCompileOnly "vazkii.patchouli:Patchouli:${patchouli_version}-FORGE"
    if (!minimumRuntime) {
        modRuntimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}-FORGE"
    }

    // Powah
    modCompileOnly "curse.maven:powah-633483:${powah_version}"
    modCompileOnly "dev.architectury:architectury-forge:${architectury_version}"
    if (!minimumRuntime) {
        modRuntimeOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
        modRuntimeOnly "curse.maven:powah-633483:${powah_version}"
    }

    testModImplementation sourceSets.main.output

