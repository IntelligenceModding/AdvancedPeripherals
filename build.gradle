    modCompileOnly "org.apiguardian:apiguardian-api:1.1.2" // prevent `warning: unknown enum constant Status.STABLE`
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junit_version}"

    // EMI
    modRuntimeOnly "dev.emi:emi-forge:${emi_version}"
    // Spark
    modRuntimeOnly "maven.modrinth:spark:1.10.53-forge"

