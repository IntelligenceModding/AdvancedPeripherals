        modRuntimeOnly "curse.maven:glodium-957920:${glodium_version}"

        // Sophisticated Backpacks
        modRuntimeOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
        modRuntimeOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
